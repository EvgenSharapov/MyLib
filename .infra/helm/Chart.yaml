apiVersion: v2
name: spring-boot-app
description: A Helm chart for Kubernetes deployment of Spring Boot application
type: application
version: 0.1.0
appVersion: "1.0.0"

# Метаданные
maintainers:
  - name: Your Team
    email: team@example.com

# Документация
home: https://example.com
sources:
  - https://github.com/your-org/your-project

# Ключевые слова для поиска
keywords:
  - spring-boot
  - java
  - web

