databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: evgeny_sharapov
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(200)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            tableName: roles
            indexName: idx_roles_name
            columns:
              - column:
                  name: name
                  type: VARCHAR(50)
        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uk_roles_name