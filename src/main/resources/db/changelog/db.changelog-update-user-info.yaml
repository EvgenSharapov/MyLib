databaseChangeLog:
  - changeSet:
      id: update-user-info-table
      author: evgeny_sharapov
      changes:
        - addColumn:
            tableName: user_info
            columns:
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: last_login
                  type: TIMESTAMP
              - column:
                  name: failed_login_attempts
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: locked_until
                  type: TIMESTAMP
        - createIndex:
            tableName: user_info
            indexName: idx_user_info_is_active
            columns:
              - column:
                  name: is_active
        - createIndex:
            tableName: user_info
            indexName: idx_user_info_email_verified
            columns:
              - column:
                  name: email_verified
        - createIndex:
            tableName: user_info
            indexName: idx_user_info_last_login
            columns:
              - column:
                  name: last_login